name: Tests CI

# Quand lancer les tests?
on:
  push:           # À chaque fois qu'on push du code
    branches:
      - main
      - develop
  pull_request:   # Aussi quand on fait une Pull Request
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Étape 1: Télécharger le code
      - uses: actions/checkout@v4

      # Étape 2: Installer Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      # Étape 3: Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Étape 4: Lancer les tests pytest
      - name: Run tests
        run: pytest -v --tb=short

      # Étape 5: Générer un rapport de couverture
      - name: Generate coverage report
        run: pytest --cov=backend --cov-report=term-missing
