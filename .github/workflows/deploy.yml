name: Build & Deploy CD

# Quand lancer le déploiement?
on:
  push:
    branches:
      - main  # Uniquement après un push sur main

jobs:
  # Étape 1: Lancer les tests (comme le CI)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --tb=short

  # Étape 2: Construire et pousser l'image Docker
  build-and-push:
    needs: test  # Attendre que les tests passent d'abord
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Se connecter à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construire et pousser l'image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/le-bon-plat:latest
          file: ./Dockerfile

      - name: Image built and pushed successfully
        run: echo "Image Docker poussee sur Docker Hub"

  # Étape 3: Déclencher le déploiement sur Render
  notify-render:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        run: |
          curl --request POST \
            --url ${{ secrets.RENDER_DEPLOY_HOOK }} \
            --header 'content-type: application/json'

      - name: Deployment triggered
        run: echo "🚀 Déploiement déclenché sur Render!"
