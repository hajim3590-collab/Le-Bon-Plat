name: Build & Deploy CD

on:
  push:
    branches:
      - main

jobs:
  # Étape 1: Lancer les tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --tb=short

  # Étape 2: Construire et pousser l'image sur Docker Hub
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/le-bon-plat:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/le-bon-plat:latest

      - name: Done
        run: |
          echo "Image disponible sur Docker Hub"
          echo "Pour lancer en local: docker run -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/le-bon-plat:latest"
