<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Bon Plat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .content {
            padding: 40px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            opacity: 0.9;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        .results {
            display: none;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #ddd;
        }
        .prediction-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .prediction-box h2 {
            font-size: 2em;
            margin-bottom: 15px;
        }
        .dishes {
            margin-top: 30px;
        }
        .dishes h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .dish-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .dish-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .dish-name {
            font-weight: bold;
            color: #333;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        .context {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .prob-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ Le Bon Plat</h1>
            <p>Découvrez le plat parfait selon votre température, budget et saison</p>
        </div>

        <div class="content">
            <form id="predictionForm">
                <h2 style="margin-bottom: 30px; color: #333;">Vos Préférences</h2>

                <div class="form-row">
                    <div>
                        <label for="temperature">Température (°C)</label>
                        <input type="number" id="temperature" step="0.1" value="15" required>
                    </div>
                    <div>
                        <label for="budget">Budget (€)</label>
                        <input type="number" id="budget" step="0.5" value="15" required>
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label for="mois">Mois</label>
                        <select id="mois" required>
                            <option value="1">Janvier</option>
                            <option value="2">Février</option>
                            <option value="3">Mars</option>
                            <option value="4">Avril</option>
                            <option value="5">Mai</option>
                            <option value="6">Juin</option>
                            <option value="7">Juillet</option>
                            <option value="8">Août</option>
                            <option value="9">Septembre</option>
                            <option value="10">Octobre</option>
                            <option value="11">Novembre</option>
                            <option value="12">Décembre</option>
                        </select>
                    </div>
                    <div>
                        <label for="jour">Jour de la Semaine</label>
                        <select id="jour" required>
                            <option value="0">Lundi</option>
                            <option value="1">Mardi</option>
                            <option value="2">Mercredi</option>
                            <option value="3">Jeudi</option>
                            <option value="4">Vendredi</option>
                            <option value="5">Samedi</option>
                            <option value="6">Dimanche</option>
                        </select>
                    </div>
                </div>

                <button type="submit">🎯 Obtenir ma Recommandation</button>
            </form>

            <div class="loading" id="loading">⏳ Analyse en cours...</div>
            <div class="error" id="error"></div>

            <div class="results" id="results">
                <div class="context" id="context"></div>

                <div class="prediction-box">
                    <h2 id="prediction-category">--</h2>
                    <p>Confiance : <span id="confidence-percent">--</span>%</p>
                </div>

                <div class="dishes">
                    <h3>📋 Plats Recommandés</h3>
                    <div class="dish-list" id="dishList"></div>
                </div>

                <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 8px;">
                    <h3 style="margin-bottom: 15px;">📊 Probabilités</h3>
                    <div id="probabilitiesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const temperature = parseFloat(document.getElementById('temperature').value);
            const budget = parseFloat(document.getElementById('budget').value);
            const mois = parseInt(document.getElementById('mois').value);
            const jour = parseInt(document.getElementById('jour').value);

            loading.style.display = 'block';
            error.style.display = 'none';
            results.style.display = 'none';

            try {
                const response = await fetch('http://localhost:5000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        temperature_c: temperature,
                        budget: budget,
                        mois: mois,
                        jour_semaine: jour
                    })
                });

                const data = await response.json();

                if (data.statut === 'erreur') {
                    throw new Error(data.erreur);
                }

                displayResults(data);

            } catch (err) {
                error.textContent = 'Erreur : ' + err.message;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });

        function displayResults(data) {
            const moisNames = ['', 'Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
                             'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
            const jourNames = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

            document.getElementById('context').innerHTML = `
                <strong>Contexte :</strong>
                🌡️ ${data.contexte.temperature}°C | 
                💰 ${data.contexte.budget}€ | 
                📅 ${moisNames[data.contexte.mois]} | 
                📆 ${jourNames[data.contexte.jour_semaine]}
            `;

            const pred = data.prediction;
            const confiance = Math.round(pred.confiance * 100);

            document.getElementById('prediction-category').textContent = pred.categorie;
            document.getElementById('confidence-percent').textContent = confiance;

            document.getElementById('dishList').innerHTML = data.plats_recommandes
                .map(dish => `<div class="dish-card"><div class="dish-name">🍽️ ${dish.dish_name}</div><div style="color: #667eea; font-size: 0.9em;">${dish.category}</div></div>`)
                .join('');

            document.getElementById('probabilitiesList').innerHTML = Object.entries(pred.probabilites)
                .map(([cat, prob]) => `<div class="prob-item"><span>${cat}</span><strong>${Math.round(prob * 100)}%</strong></div>`)
                .join('');

            results.style.display = 'block';
        }
    </script>
</body>
</html>
