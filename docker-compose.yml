version: '3.8'

services:
  backend:
    build: .
    container_name: le-bon-plat-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    networks:
      - le-bon-plat-network

  frontend:
    image: nginx:latest
    container_name: le-bon-plat-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - le-bon-plat-network

networks:
  le-bon-plat-network:
    driver: bridge
